<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html,
        body {
            background: #020603;
            height: 100%;
            margin: 0;
            overflow: hidden;
            width: 100%;
        }

        .face {
            background: radial-gradient(circle, #07170a 0%, #020603 72%);
            border-radius: 50%;
            height: 450px;
            overflow: hidden;
            position: relative;
            width: 450px;
        }

        video {
            filter: saturate(1.4) contrast(1.15) brightness(1.08)
                drop-shadow(0 0 10px #77ff72);
            height: 100%;
            left: 0;
            object-fit: cover;
            opacity: 0.92;
            position: absolute;
            top: 0;
            width: 100%;
        }

        .tint,
        .vignette,
        .scanlines {
            inset: 0;
            pointer-events: none;
            position: absolute;
        }

        .tint {
            background: rgba(42, 255, 72, 0.18);
            mix-blend-mode: screen;
        }

        .vignette {
            background:
                radial-gradient(circle, transparent 58%, rgba(0, 0, 0, 0.36) 75%, rgba(0, 0, 0, 0.96) 100%),
                radial-gradient(circle at 50% 50%, transparent 0 88%, rgba(119, 255, 114, 0.2) 89%, transparent 90%);
        }

        .scanlines {
            background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 4px);
        }
    </style>
</head>
<body>
    <div class="face">
        <video id="startup" src="../img/imported-pipboy/startup.mp4" autoplay muted playsinline></video>
        <div class="tint"></div>
        <div class="vignette"></div>
        <div class="scanlines"></div>
    </div>
    <script>
        const video = document.getElementById("startup");
        video.addEventListener("loadedmetadata", () => {
            video.currentTime = Math.min(1.9, Math.max(0.4, video.duration * 0.45));
        });
    </script>
</body>
</html>
